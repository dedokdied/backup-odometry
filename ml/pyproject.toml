[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odom-ml"
version = "0.1.0"
description = "Model-based backup odometry ML pipeline for the tram hackathon case"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "rosbags>=0.9",
    "pyarrow>=14",
]

[project.optional-dependencies]
export = ["onnx>=1.15", "onnxruntime>=1.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The fleet-wide dataset tests inflate the compressed run caches and take about a
# minute. They are the slowest checks but not the most frequent ones, so the
# default run skips them; `pytest ml/tests -m slow` runs exactly those.
addopts = "-m 'not slow'"
markers = [
    "slow: sweeps the whole run cache and takes about a minute",
    "dataset: needs the bag dataset on disk",
]
